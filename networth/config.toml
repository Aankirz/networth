[triggers]
price_multiple = 2.5
vol_window_days = 60

# Engine assets to look up when a confirmed story of this type arrives (news first), and the
# types a price jump on an asset can be explained by (price first).
[triggers.assets_by_type]
rbi_hike = ["^NSEBANK", "^NSEI"]
rbi_cut = ["^NSEBANK", "^NSEI"]
union_budget = ["^NSEI", "^CNXINFRA"]
inr_shock = ["INR=X", "^NSEI"]
fed_hike = ["SPY", "QQQ", "TLT"]
fed_cut = ["SPY", "QQQ", "TLT"]
tariff = ["SPY", "XLI", "^NSEI"]
bank_stress = ["XLF", "^NSEBANK"]
election = ["SPY", "^NSEI"]
military_conflict = ["SPY", "^NSEI", "GLD"]
oil_supply = ["BZ=F", "XLE", "JETS", "^NSEI"]
pandemic = ["SPY", "^NSEI"]

# Price first. An asset with a benchmark is measured on its excess return over it; an index
# with none is measured raw.
[[triggers.price_watch]]
asset = "^NSEI"

