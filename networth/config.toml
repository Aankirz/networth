# Networth runtime config. Parsed once by networth/config.py into a typed Config.
# Model ids live here and nowhere else in the code.

[roles.cheap]  # groups news articles into stories, every cycle
provider = "openai"
model = "gpt-5.6-luna"
reasoning_effort = "low"
max_output_tokens = 8000

[roles.judge]  # classifies a confirmed story once, for all users
provider = "openai"
model = "gpt-5.6-sol"
reasoning_effort = "low"
max_output_tokens = 4000

[roles.writer]  # words every user-facing sentence: briefs, chat answers, Explain this
provider = "openai"
model = "gpt-5.6-terra"
reasoning_effort = "medium"
max_output_tokens = 4000

[roles.vision]  # reads the text in a forwarded screenshot; terra takes "Text, Image" input
provider = "openai"
model = "gpt-5.6-terra"
reasoning_effort = "low"
max_output_tokens = 4000

# USD per 1M tokens, from each model's page on developers.openai.com, fetched 2026-10-25.
# Pricing overview: https://developers.openai.com/api/docs/pricing
[prices."gpt-5.6-luna"]
input_per_m = 0.20
cached_per_m = 0.02
output_per_m = 1.20
source_url = "https://developers.openai.com/api/docs/models/gpt-5.6-luna"

[prices."gpt-5.6-terra"]
input_per_m = 2.00
cached_per_m = 0.20
output_per_m = 12.00
source_url = "https://developers.openai.com/api/docs/models/gpt-5.6-terra"

[prices."gpt-5.6-sol"]  # promotional price, through at least 2026-11-21
input_per_m = 4.00
cached_per_m = 0.40
output_per_m = 20.00
source_url = "https://developers.openai.com/api/docs/models/gpt-5.6-sol"

[http]
exa_deadline_s = 30
openai_deadline_s = 120
connect_timeout_s = 5
prices_deadline_s = 60  # one yfinance download of every price_watch asset; 2 tickers took 0.5 s

[confirm]
min_publishers = 3
window_hours = 24
# A host equal to one of these, or a subdomain of one, is a primary source.
primary_domains = [
  "rbi.org.in", "sebi.gov.in", "pib.gov.in", "federalreserve.gov", "sec.gov",
  "nseindia.com", "bseindia.com", "opec.org", "finmin.nic.in", "indiabudget.gov.in",
  "treasury.gov", "ustr.gov", "whitehouse.gov", "who.int",
]
# A host starting with one of these is a company investor-relations page.
primary_host_prefixes = ["investor.", "investors.", "ir."]

# An article whose title, author or first 300 characters carry one of these markers is a
# repost of that agency's copy, so all of its reposts count as one publisher.
[confirm.wire_agencies]
Reuters = ["(Reuters)", "Reuters -", "By Reuters", "Reuters reported"]
PTI = ["(PTI)", "PTI -", "PTI reported", "Press Trust of India"]
ANI = ["(ANI)", "ANI -", "Asian News International"]
AP = ["(AP)", "Associated Press"]
AFP = ["(AFP)", "AFP -", "Agence France-Presse"]
Bloomberg = ["(Bloomberg)", "Bloomberg News"]
IANS = ["(IANS)", "IANS -"]

[confirm.publisher_aliases]
"reuters.com" = "Reuters"
"apnews.com" = "AP"
"bloomberg.com" = "Bloomberg"
"ptinews.com" = "PTI"
"aninews.in" = "ANI"
"ianslive.in" = "IANS"
"afp.com" = "AFP"

[classify]
max_judge_calls_per_cycle = 40  # about $0.006 a call, measured 2026-10-25
# An event dated more than this many days before the cycle's date is old news: shown in the
# report, never a trigger. Stories routinely arrive 1 to 3 days after the event (search dates
# lag, regional outlets report late), and the user acts monthly, so an event from the past
# week is still news. 7 days is far inside the engine's 21-session horizon, so the base rate
# still describes what lies ahead. Decided every cycle, never stored with the answer.
event_max_age_days = 7

[product]
# Jev picks the chat intent while the production path (Jev when at least jev_min_confidence
# sure, else the cheap model) is at least as accurate on the held-out set
# (uv run python -m evals.intent_accuracy heldout) as the cheap model alone. On 2026-10-25 both
# were 24/24 and the path was about 3x faster, so it is on. Below the confidence, on an error or
# past the deadline, the cheap model decides.
use_jev_for_intent = true
jev_min_confidence = 0.7
jev_deadline_s = 4
# A rare alert needs at least 8 independent past episodes (PRODUCT.md) and a gap of 15 points
# between the hit rate and the normal-period rate. The pages call 10 points a lean; 15 is
# half again as wide, so an alert fires only where the scoreboard would already show a clear
# green or red and the count is not a weak signal. At most 2 a month per user (PRODUCT.md).
alert_min_episodes = 8
alert_min_gap = 0.15
alert_max_per_month = 2
tip_lookback_days = 7  # how far back a tip check searches the news
# Paid chat answers per user per rolling hour. One answer is a pick plus at most a search, a
# same-claim check and a writer call, about $0.03, so the cap holds one user to about $0.60 an
# hour. 20 is far above a person asking questions and far below a script.
chat_max_per_hour = 20
# A watch is an explicit request, so pull-only users may set one. At most 5 standing at once and
# 4 watch messages a month per person, on top of the 2 rare alerts, keep "quiet by default".
watch_max_active = 5
watch_max_per_month = 4
link_code_minutes = 10  # a /link code is single use and stops working after this
memory_days = 60  # an asked term older than this never comes back in a brief

[group]
batch_size = 50  # articles per grouping call

[pull]
lookback_hours = 48
results_per_query = 10
max_queries_per_cycle = 20

[[pull.queries]]
types = ["rbi_hike", "rbi_cut"]
region = "in"
text = "Reserve Bank of India repo rate decision monetary policy committee"

