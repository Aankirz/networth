[project]
name = "networth"
version = "0.1.0"
description = "Networth history engine: event studies and base rates for US and Indian assets"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.0",
    "openai>=3.37.0",
    "pandas>=3.1.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
